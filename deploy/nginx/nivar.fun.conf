# NIVAR — Nginx site for nivar.fun
# Install:
#   sudo cp deploy/nginx/nivar.fun.conf /etc/nginx/sites-available/nivar.fun
#   sudo ln -sf /etc/nginx/sites-available/nivar.fun /etc/nginx/sites-enabled/nivar.fun
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nivar.fun -d www.nivar.fun   # adds the 443 block + redirect

server {
    listen 80;
    listen [::]:80;
    server_name nivar.fun www.nivar.fun;

    # NIVAR web (Next.js on :3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # NIVAR api (Fastify on :4000), reachable at https://nivar.fun/api/...
    # (trailing slash on proxy_pass strips the /api prefix → /api/state hits /state)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
