<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>NIVAR — Survive the Winter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --frost:#7dd3fc; --snow:#eaf4ff; --muted:#9fb6cc;
  --ember:#ff8a2b; --gold:#ffce54; --good:#67e8b0; --bad:#ff6b6b;
  --token:#7CFFB0; --neon:#56e0ff;
  --c-common:#9fb6cc; --c-rare:#5aa0e0; --c-epic:#b06bff; --c-legendary:#ffb24d;
  font-synthesis:none;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:'Rajdhani',system-ui,sans-serif; background:#06101c; color:var(--snow);
  user-select:none; display:flex; align-items:center; justify-content:center; }
button{ font-family:inherit; color:inherit; border:0; background:none; cursor:pointer; }
button:focus-visible{ outline:2px solid var(--frost); outline-offset:1px; }
b{ font-weight:700; }
::-webkit-scrollbar{ width:0; height:0; }

#game{ position:relative; width:min(100vw,480px); height:min(100dvh,940px);
  overflow:hidden; background:#9fb8cf; box-shadow:0 30px 90px rgba(0,0,0,.6); touch-action:none; }
@media (min-width:520px){ #game{ border-radius:24px; } }
#world{ position:absolute; inset:0; z-index:1; }
#overlay{ position:absolute; inset:0; z-index:2; pointer-events:none; }

/* building label/hotspot */
.bspot{ position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px; }
.bspot .nm{ font-family:'Oswald'; font-weight:600; font-size:11.5px; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.85); white-space:nowrap; padding:1px 8px; border-radius:9px; background:rgba(10,22,36,.42); }
.bspot .lv{ display:flex; align-items:center; gap:3px; font-family:'Oswald'; font-weight:700; font-size:10px;
  color:#06210f; background:linear-gradient(180deg,#aaffd0,#5fe6a0); padding:0px 6px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.4); }
.bspot.busy .lv{ background:linear-gradient(180deg,#aee0ff,#7dd3fc); }
.bspot .hammer{ position:absolute; top:-16px; font-size:13px; animation:hammer .7s ease-in-out infinite; }
@keyframes hammer{ 0%,100%{ transform:rotate(-18deg) } 50%{ transform:rotate(12deg) } }
.bspot .pbar{ width:46px; height:5px; border-radius:3px; background:rgba(5,12,22,.7); overflow:hidden; margin-top:1px; display:none; }
.bspot.busy .pbar{ display:block; }
.bspot .pbar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#7dd3fc,#aee0ff); }

/* ---------- HUD ---------- */
.hud{ position:absolute; z-index:6; left:0; right:0; }
.hud-top{ top:0; padding:8px 8px 0; }
.row{ display:flex; align-items:center; gap:6px; }
.row + .row{ margin-top:6px; }
.grow{ flex:1; }
.chip{ display:flex; align-items:center; gap:5px; height:30px; padding:0 9px; border-radius:15px;
  background:linear-gradient(180deg, rgba(12,30,48,.92), rgba(7,18,30,.92)); border:1px solid rgba(125,211,252,.22);
  box-shadow:0 2px 8px rgba(0,0,0,.35); font-family:'Oswald'; font-weight:600; font-size:13px; }
.chip .ic{ font-size:14px; line-height:1; }
.chip.gem{ border-color:rgba(124,255,176,.5); } .chip.gem b{ color:var(--token); }
.chip .plus{ display:grid; place-items:center; width:17px; height:17px; border-radius:50%;
  background:linear-gradient(180deg,#5ad06a,#2fae44); color:#fff; font-size:12px; font-style:normal; margin-left:1px; }
.chip.power{ border-color:rgba(255,206,84,.4); } .chip.power b{ color:#ffe2a0; }
.avatar{ display:flex; align-items:center; gap:7px; height:38px; padding:3px 12px 3px 3px; border-radius:20px;
  background:linear-gradient(180deg, rgba(12,30,48,.92), rgba(7,18,30,.92)); border:1px solid rgba(125,211,252,.22); }
.avatar .face{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:18px;
  background:radial-gradient(circle at 50% 35%, #2b5a82, #14304a); border:1.5px solid #7dd3fc; }
.avatar .lvtxt{ font-family:'Oswald'; font-weight:700; font-size:12px; line-height:1; }
.avatar .xp{ width:64px; height:5px; border-radius:3px; background:rgba(5,12,22,.7); overflow:hidden; margin-top:3px; }
.avatar .xp i{ display:block; height:100%; width:62%; background:linear-gradient(90deg,#67e8b0,#36c98a); }
.temp{ display:flex; align-items:center; gap:5px; height:30px; padding:0 10px 0 8px; border-radius:15px;
  background:linear-gradient(180deg, rgba(12,30,48,.92), rgba(7,18,30,.92)); border:1px solid rgba(125,211,252,.3); }
.temp b{ font-family:'Oswald'; font-weight:600; font-size:12.5px; color:#cfe6ff; }
.temp .sub{ font-size:9px; color:var(--muted); letter-spacing:.04em; margin-left:1px; }
.vip{ display:flex; align-items:center; gap:4px; height:30px; padding:0 10px; border-radius:15px;
  background:linear-gradient(180deg,#3aa6ff,#2b6fd0); color:#04243f; font-family:'Oswald'; font-weight:700; font-size:11px; }
.vip .v{ display:grid; place-items:center; width:16px; height:16px; border-radius:50%; background:#04243f; color:#7dd3fc; font-size:10px; }
.res-strip{ display:flex; gap:6px; margin-top:6px; }
.rchip{ display:flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:13px; flex:1; justify-content:center;
  background:linear-gradient(180deg, rgba(10,24,40,.78), rgba(6,16,28,.78)); border:1px solid rgba(125,211,252,.15);
  font-family:'Oswald'; font-weight:600; font-size:12px; }
.rchip .ic{ font-size:13px; }

.left-cards{ position:absolute; z-index:6; left:8px; top:118px; display:flex; flex-direction:column; gap:8px; }
.wcard{ display:flex; align-items:center; gap:8px; padding:6px 11px 6px 8px; border-radius:13px; width:186px;
  background:linear-gradient(180deg, rgba(40,14,20,.9), rgba(20,8,12,.9)); border:1px solid rgba(255,107,107,.35); box-shadow:0 4px 14px rgba(0,0,0,.35); }
.wcard .wi{ font-size:18px; }
.wcard .wt{ font-family:'Oswald'; font-weight:600; font-size:12px; line-height:1.15; color:#ffd0d0; }
.wcard .wtime{ font-family:'Oswald'; font-weight:700; font-size:13px; color:#ff9a9a; }
.hcard{ display:flex; gap:4px; padding:5px; border-radius:13px; width:fit-content;
  background:linear-gradient(180deg, rgba(12,30,48,.9), rgba(7,18,30,.9)); border:1px solid rgba(125,211,252,.22); }
.hcard .ha{ width:34px; height:40px; border-radius:9px; display:grid; place-items:center; font-size:20px; position:relative;
  background:radial-gradient(circle at 50% 30%, #2b5a82, #122a42); border:1.5px solid; }

.right-rail{ position:absolute; z-index:6; right:6px; top:120px; display:flex; flex-direction:column; gap:9px; }
.rr{ width:52px; display:flex; flex-direction:column; align-items:center; gap:1px; }
.rr .ri{ width:46px; height:46px; border-radius:13px; display:grid; place-items:center; font-size:22px; position:relative;
  background:linear-gradient(180deg, rgba(20,44,68,.95), rgba(10,24,40,.95)); border:1px solid rgba(125,211,252,.28); box-shadow:0 3px 10px rgba(0,0,0,.4); }
.rr .ri::after{ content:''; position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:#ff4d4d; box-shadow:0 0 0 2px rgba(10,24,40,.9); }
.rr .rl{ font-family:'Oswald'; font-weight:600; font-size:9.5px; color:#dbeeff; text-shadow:0 1px 2px #000; }
.rr:active .ri{ transform:scale(.93); }

.task-bar{ position:absolute; z-index:6; left:8px; right:8px; bottom:62px; display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:14px;
  background:linear-gradient(180deg, rgba(12,30,48,.92), rgba(7,18,30,.94)); border:1px solid rgba(125,211,252,.22); box-shadow:0 6px 20px rgba(0,0,0,.4); }
.task-bar .ti{ width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center; font-size:16px; background:rgba(124,255,176,.14); border:1px solid rgba(124,255,176,.3); }
.task-bar .tmid{ flex:1; min-width:0; }
.task-bar .tt{ font-family:'Oswald'; font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.task-bar .tt .rw{ color:var(--token); }
.task-bar .ttrack{ height:6px; border-radius:4px; background:rgba(5,12,22,.7); overflow:hidden; margin-top:4px; }
.task-bar .ttrack i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#7CFFB0,#36c98a); transition:width .3s; }
.task-bar .tmail{ width:34px; height:34px; flex:none; border-radius:10px; display:grid; place-items:center; font-size:16px; position:relative; background:rgba(125,211,252,.12); border:1px solid rgba(125,211,252,.25); }
.task-bar .tmail .dot{ position:absolute; top:-3px; right:-3px; width:16px; height:16px; border-radius:50%; background:#ff4d4d; color:#fff; font-family:'Oswald'; font-weight:700; font-size:10px; display:grid; place-items:center; }

.bottom-nav{ position:absolute; z-index:16; left:0; right:0; bottom:0; height:58px; display:flex;
  background:linear-gradient(180deg, rgba(9,22,36,.97), rgba(5,13,22,.99)); border-top:1px solid rgba(125,211,252,.16); }
.nav{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-family:'Oswald'; font-weight:600; font-size:9.5px; color:#9fb6cc; position:relative; }
.nav .ni{ font-size:19px; }
.nav.active{ color:var(--token); }
.nav.active .ni{ filter:drop-shadow(0 0 6px rgba(124,255,176,.5)); }
.nav:active{ transform:translateY(1px); }
.nav .ndot{ position:absolute; top:6px; right:30%; width:8px; height:8px; border-radius:50%; background:#ff4d4d; }

.hintdrag{ position:absolute; z-index:5; left:50%; bottom:128px; transform:translateX(-50%); font-family:'Oswald'; font-weight:600; font-size:11px;
  color:#eaf4ff; background:rgba(8,18,30,.6); padding:5px 12px; border-radius:20px; border:1px solid rgba(125,211,252,.25); pointer-events:none; transition:opacity .5s; }

/* ---------- full-screen pages ---------- */
#screen{ position:absolute; inset:0; z-index:15; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.85,.25,1);
  background:linear-gradient(180deg,#0b1f33,#06101c); display:flex; flex-direction:column; }
#screen.on{ transform:translateY(0); }
.scr-head{ display:flex; align-items:center; gap:10px; padding:12px 12px 10px; border-bottom:1px solid rgba(125,211,252,.12); }
.scr-back{ width:36px; height:36px; border-radius:11px; display:grid; place-items:center; font-size:18px; background:rgba(125,211,252,.1); border:1px solid rgba(125,211,252,.22); }
.scr-title{ font-family:'Oswald'; font-weight:700; font-size:19px; flex:1; }
.scr-bal{ display:flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:15px; background:rgba(124,255,176,.1); border:1px solid rgba(124,255,176,.4); font-family:'Oswald'; font-weight:700; font-size:13px; color:var(--token); }
.scr-body{ flex:1; overflow:auto; padding:12px; padding-bottom:74px; }
.scr-sub{ font-size:12px; color:var(--muted); margin:-2px 0 12px; line-height:1.35; }

/* squad bar */
.squadbar{ display:flex; align-items:center; gap:8px; padding:11px; border-radius:14px; margin-bottom:14px;
  background:linear-gradient(180deg, rgba(124,255,176,.07), rgba(86,224,255,.03)); border:1px solid rgba(124,255,176,.2); }
.squadbar .sp{ flex:none; }
.squadbar .sp .k{ font-size:9px; letter-spacing:.13em; color:var(--token); font-weight:700; }
.squadbar .sp .v{ font-family:'Oswald'; font-weight:700; font-size:20px; }
.slots{ display:flex; gap:6px; flex:1; justify-content:flex-end; }
.slot{ width:42px; height:50px; border-radius:10px; display:grid; place-items:center; position:relative; font-size:22px;
  background:rgba(6,16,28,.6); border:1.5px dashed rgba(125,211,252,.3); }
.slot.full{ border-style:solid; }
.slot .sl-lv{ position:absolute; bottom:-2px; right:-2px; font-family:'Oswald'; font-weight:700; font-size:9px; padding:0 4px; border-radius:7px; background:#0a1a2b; border:1px solid rgba(125,211,252,.4); }

.btn-row{ display:flex; gap:8px; margin-bottom:14px; }
.sumbtn{ flex:1; height:54px; border-radius:14px; font-family:'Oswald'; font-weight:700; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  background:linear-gradient(180deg,#b06bff,#7a3bd0); color:#fff; box-shadow:0 8px 22px rgba(124,59,208,.35); }
.sumbtn small{ font-size:11px; opacity:.9; font-weight:600; }
.sumbtn:active{ transform:translateY(1px); } .sumbtn[disabled]{ filter:grayscale(.6) brightness(.7); }
.sumbtn.ten{ background:linear-gradient(180deg,#ffb24d,#ff7a1a); box-shadow:0 8px 22px rgba(255,122,26,.35); }

.hgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.hcardx{ border-radius:14px; padding:9px 7px 8px; text-align:center; position:relative; cursor:pointer; overflow:hidden;
  background:linear-gradient(180deg, rgba(16,36,56,.9), rgba(8,18,30,.95)); border:1.5px solid; }
.hcardx:active{ transform:scale(.97); }
.hcardx .he{ font-size:34px; line-height:1; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.hcardx .hn{ font-family:'Oswald'; font-weight:600; font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hcardx .hr{ font-size:8.5px; letter-spacing:.1em; font-weight:700; text-transform:uppercase; margin-top:1px; }
.hcardx .hlv{ position:absolute; top:5px; left:5px; font-family:'Oswald'; font-weight:700; font-size:10px; padding:0 5px; border-radius:7px; background:rgba(6,16,28,.85); }
.hcardx .heq{ position:absolute; top:5px; right:5px; font-size:11px; }
.hcardx .hpow{ font-family:'Oswald'; font-weight:700; font-size:11px; color:#ffe2a0; margin-top:2px; }
.hcardx.locked{ filter:grayscale(1) brightness(.5); border-color:rgba(125,211,252,.15)!important; }
.hcardx.locked .he{ opacity:.4; }
.shardtag{ position:absolute; bottom:5px; right:6px; font-size:9px; font-weight:700; color:var(--neon); }

/* raid list */
.raid{ display:flex; align-items:center; gap:11px; padding:11px; border-radius:14px; margin-bottom:9px;
  background:linear-gradient(180deg, rgba(16,36,56,.85), rgba(8,18,30,.9)); border:1px solid rgba(125,211,252,.15); }
.raid.locked{ opacity:.5; }
.raid .re{ width:48px; height:48px; flex:none; border-radius:12px; display:grid; place-items:center; font-size:26px; background:rgba(6,16,28,.6); border:1px solid rgba(255,107,107,.25); }
.raid .rmid{ flex:1; min-width:0; }
.raid .rn{ font-family:'Oswald'; font-weight:600; font-size:14px; }
.raid .rsub{ font-size:11px; color:var(--muted); }
.raid .rrew{ font-size:11px; color:#cfe6ff; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.raid .rbtn{ flex:none; width:74px; height:42px; border-radius:11px; font-family:'Oswald'; font-weight:700; font-size:13px; display:grid; place-items:center;
  background:linear-gradient(180deg,#ff6b6b,#d33); color:#fff; }
.raid .rbtn.cleared{ background:linear-gradient(180deg, rgba(103,232,176,.2), rgba(103,232,176,.08)); color:var(--good); border:1px solid rgba(103,232,176,.4); }
.raid .rbtn.cd{ background:rgba(125,211,252,.12); color:var(--frost); border:1px solid rgba(125,211,252,.3); font-size:12px; }
.raid .rbtn[disabled]{ filter:grayscale(.6) brightness(.7); }

/* research */
.tech{ display:flex; align-items:center; gap:11px; padding:11px; border-radius:14px; margin-bottom:9px;
  background:linear-gradient(180deg, rgba(16,36,56,.85), rgba(8,18,30,.9)); border:1px solid rgba(125,211,252,.15); }
.tech .te{ width:44px; height:44px; flex:none; border-radius:11px; display:grid; place-items:center; font-size:22px; background:rgba(86,224,255,.1); border:1px solid rgba(86,224,255,.3); }
.tech .tmid{ flex:1; min-width:0; }
.tech .tn{ font-family:'Oswald'; font-weight:600; font-size:14px; }
.tech .tef{ font-size:11px; color:var(--neon); }
.tech .tco{ font-size:11px; color:#cfe6ff; margin-top:2px; }
.tech .tbtn{ flex:none; width:74px; height:42px; border-radius:11px; font-family:'Oswald'; font-weight:700; font-size:12px; display:grid; place-items:center; line-height:1.05; text-align:center;
  background:linear-gradient(180deg,#56e0ff,#2b9fd0); color:#04243f; }
.tech .tbtn.max{ background:rgba(124,255,176,.15); color:var(--good); border:1px solid rgba(124,255,176,.4); }
.tech .tbtn[disabled]{ filter:grayscale(.6) brightness(.7); }

/* shop */
.shopcard{ padding:13px; border-radius:16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
  background:linear-gradient(180deg, rgba(16,36,56,.9), rgba(8,18,30,.95)); border:1px solid rgba(255,206,84,.3); }
.shopcard .se{ width:54px; height:54px; flex:none; border-radius:13px; display:grid; place-items:center; font-size:30px; background:rgba(255,206,84,.12); border:1px solid rgba(255,206,84,.35); }
.shopcard .smid{ flex:1; } .shopcard .sn{ font-family:'Oswald'; font-weight:700; font-size:15px; } .shopcard .sd{ font-size:11.5px; color:var(--muted); line-height:1.3; }
.shopcard .sbtn{ flex:none; height:40px; padding:0 16px; border-radius:11px; font-family:'Oswald'; font-weight:700; font-size:13px; display:grid; place-items:center;
  background:linear-gradient(180deg,#ffce54,#f0a91a); color:#3a2a08; }
.shopcard .sbtn[disabled]{ filter:grayscale(.5) brightness(.8); }

/* ---------- bottom sheet ---------- */
#bd{ position:fixed; inset:0; z-index:20; background:rgba(3,8,16,.5); opacity:0; pointer-events:none; transition:opacity .22s; backdrop-filter:blur(2px); }
#bd.on{ opacity:1; pointer-events:auto; }
#sheet{ position:fixed; left:50%; bottom:0; transform:translate(-50%,110%); z-index:21; width:min(100vw,480px); max-height:80dvh; overflow:auto;
  background:linear-gradient(180deg,#102a42,#081626); border-radius:22px 22px 0 0; border-top:1px solid rgba(125,211,252,.25); box-shadow:0 -18px 50px rgba(0,0,0,.6);
  transition:transform .3s cubic-bezier(.2,.85,.25,1); padding:14px 14px 20px; }
@media (min-width:520px){ #sheet{ border-radius:22px; bottom:12px; } }
#sheet.on{ transform:translate(-50%,0); }
.grab{ width:38px; height:4px; border-radius:3px; background:rgba(125,211,252,.3); margin:0 auto 12px; }
.sh-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.sh-ic{ width:56px; height:56px; flex:none; border-radius:14px; display:grid; place-items:center; font-size:30px;
  background:linear-gradient(180deg, rgba(20,44,68,.95), rgba(10,24,40,.95)); border:1px solid rgba(125,211,252,.25); }
.sh-t{ font-family:'Oswald'; font-weight:600; font-size:21px; }
.sh-s{ font-size:12.5px; color:var(--muted); }
.statrow{ display:flex; gap:8px; margin-bottom:13px; }
.stat{ flex:1; padding:9px 6px; border-radius:12px; background:rgba(6,16,28,.6); border:1px solid rgba(125,211,252,.13); text-align:center; }
.stat .k{ font-size:9px; letter-spacing:.13em; color:var(--frost); font-weight:700; }
.stat .v{ font-family:'Oswald'; font-weight:600; font-size:16px; margin-top:2px; white-space:nowrap; }
.stat .v .up{ color:var(--good); } .stat .v .ar{ color:var(--good); }
.costbox{ padding:11px; border-radius:12px; background:rgba(6,16,28,.55); border:1px solid rgba(125,211,252,.13); margin-bottom:12px; }
.costbox .ct{ font-size:9.5px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin-bottom:7px; }
.costlist{ display:flex; flex-wrap:wrap; gap:10px; }
.citem{ display:flex; align-items:center; gap:5px; font-family:'Oswald'; font-weight:600; font-size:14px; }
.citem.lack{ color:var(--bad); }
.bigbtn{ width:100%; height:52px; border-radius:14px; font-family:'Oswald'; font-weight:600; font-size:16px; letter-spacing:.03em;
  background:linear-gradient(180deg,#5ad06a,#2fae44); color:#fff; box-shadow:0 8px 22px rgba(47,174,68,.3); display:flex; align-items:center; justify-content:center; gap:8px; }
.bigbtn.up{ background:linear-gradient(180deg,#ff9b3d,#ff5a1a); box-shadow:0 8px 22px rgba(255,90,26,.3); }
.bigbtn.purple{ background:linear-gradient(180deg,#b06bff,#7a3bd0); box-shadow:0 8px 22px rgba(124,59,208,.3); }
.bigbtn.alt{ background:linear-gradient(180deg, rgba(125,211,252,.18), rgba(125,211,252,.06)); border:1px solid rgba(125,211,252,.3); color:var(--frost); box-shadow:none; }
.bigbtn:active{ transform:translateY(1px); } .bigbtn[disabled]{ filter:grayscale(.7) brightness(.65); box-shadow:none; }
.tworow{ display:flex; gap:8px; } .tworow .bigbtn{ flex:1; }

const CHESTS=[ {p:40,rew:100}, {p:70,rew:150}, {p:100,rew:300} ];
function qDone(q){ return q.cur()>=q.tgt; }
function qClaimable(cat,q){ return qDone(q)&&!claimed.has(cat+':'+q.id); }
function dailyPoints(){ return QUESTS.daily.reduce((a,q)=>a+(qDone(q)?q.pts:0),0); }
function claimableCount(){ let n=0;
  for(const cat of ['main','daily','miles']) for(const q of QUESTS[cat]) if(qClaimable(cat,q))n++;
  for(let i=0;i<CHESTS.length;i++) if(dailyPoints()>=CHESTS[i].p && !chestClaimed.has(i))n++; return n; }
function grant(rew){ for(const k in rew){ if(k==='crystalBig')S.crystal+=2000; else S[k]+=rew[k]; } }
function rewText(rew){ return Object.keys(rew).map(k=> k==='crystalBig'?'💎2,000':RICON[k]+' '+ab(rew[k])).join('  '); }
function claimQuest(cat,id){ const q=QUESTS[cat].find(x=>x.id===id); if(!q||!qClaimable(cat,q))return;
  claimed.add(cat+':'+q.id); grant(q.rew); toast('Reward claimed · '+rewText(q.rew),'gold'); juiceClaim(); refresh(); renderQuests(); }
function claimChest(i){ if(dailyPoints()<CHESTS[i].p||chestClaimed.has(i))return; chestClaimed.add(i); S.crystal+=CHESTS[i].rew;
  toast('Daily chest · +'+CHESTS[i].rew+' 💎','gold'); juiceClaim(); refresh(); renderQuests(); }
function juiceClaim(){ const fl=$('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go'); }
function nextMain(){ for(const q of QUESTS.main){ if(!claimed.has('main:'+q.id))return q; } return null; }
let _tbCache='';
function updateTaskBar(){
  const cc=claimableCount(), dot=$('qDot'), tb=$('taskBar');
  if(cc>0){ dot.style.display='grid'; dot.textContent=cc; tb.classList.add('taskpulse'); } else { dot.style.display='none'; tb.classList.remove('taskpulse'); }
  let html,pct;
  if(cc>0){ html='🎁 <span class="rw">Reward ready</span> — tap to claim'; pct=100; }
  else { const q=nextMain(); if(q){ html=`${q.t} <span class="rw">+${ab(q.rew.crystal)} 💎</span>`; pct=clamp(q.cur()/q.tgt,0,1)*100; }
    else { html='All quests done — survive & dominate'; pct=100; } }
  if(html!==_tbCache){ $('taskTitle').innerHTML=html; _tbCache=html; }
  $('taskProg').style.width=pct+'%';
}
let questTab='main';
function renderQuests(){
  const tabDot=cat=>{ for(const q of QUESTS[cat]) if(qClaimable(cat,q))return true;
    if(cat==='daily') for(let i=0;i<CHESTS.length;i++) if(dailyPoints()>=CHESTS[i].p&&!chestClaimed.has(i))return true; return false; };
  const tabs=[['main','Campaign'],['daily','Daily'],['miles','Goals']].map(([k,lbl])=>
    `<button class="qtab ${questTab===k?'on':''}" data-qt="${k}">${lbl}${tabDot(k)?'<span class="qdot"></span>':''}</button>`).join('');
  let body='';
  if(questTab==='daily'){
    const dp=dailyPoints(), pct=clamp(dp/100,0,1)*100;
    const marks=CHESTS.map((c,i)=>{ const ready=dp>=c.p&&!chestClaimed.has(i), got=chestClaimed.has(i);
      return `<div class="qcmark"><div class="cb2 ${ready?'ready':''} ${got?'got':''}" data-chest="${i}">${got?'✓':'🎁'}</div>${c.p}</div>`; }).join('');
    body+=`<div class="qchest"><div class="qcbar"><div style="font-family:Oswald;font-weight:700;font-size:12px;margin-bottom:6px">Daily activity · ${dp}/100</div>
      <div class="qctrack"><i style="width:${pct}%"></i></div><div class="qcmarks">${marks}</div></div></div>
      <div class="scr-sub" style="margin-top:-4px">Finish daily tasks to fill the bar and pop chests. Resets every day.</div>`;
  } else body+=`<div class="scr-sub">${questTab==='main'?'Your campaign — follow it top-to-bottom to grow and unlock the game.':'Long-term flex goals with big payouts.'}</div>`;
  body+=QUESTS[questTab].map(q=>{ const cat=questTab, cur=Math.min(q.cur(),q.tgt), pct=clamp(q.cur()/q.tgt,0,1)*100;
    const cl=qClaimable(cat,q), done=claimed.has(cat+':'+q.id);
    const btn=done?'<button class="qbtn ok" disabled>✓</button>':cl?`<button class="qbtn" data-claim="${cat}:${q.id}">CLAIM</button>`:'<button class="qbtn wait" disabled>···</button>';
    return `<div class="quest ${cl?'claimable':''} ${done?'claimed':''}"><div class="qe">${q.e}</div>
      <div class="qmid"><div class="qn">${q.t}</div><div class="qtrack"><i style="width:${pct}%"></i></div>
      <div class="qp">${ab(cur)} / ${ab(q.tgt)} · 🎁 ${rewText(q.rew)}${q.pts?' · +'+q.pts+'pts':''}</div></div>${btn}</div>`; }).join('');
  $('scrBody').innerHTML=`<div class="qtabs">${tabs}</div>${body}`;
  $('scrBody').querySelectorAll('[data-qt]').forEach(el=>el.addEventListener('click',()=>{ questTab=el.dataset.qt; renderQuests(); }));
  $('scrBody').querySelectorAll('[data-claim]').forEach(el=>el.addEventListener('click',()=>{ const p=el.dataset.claim.split(':'); claimQuest(p[0],p[1]); }));
  $('scrBody').querySelectorAll('[data-chest]').forEach(el=>el.addEventListener('click',()=>claimChest(+el.dataset.chest)));
}

  let prevCleared=true;
  const rows=STAGES.map((st,i)=>{ const cl=S.clears[st.id]||{}; const locked=!prevCleared; const onCd=cl.cd&&now<cl.cd;
    const rew=Object.keys(st.rew).map(k=>`${RICON[k]}${ab(st.rew[k])}`).join('  ');
    let btn; if(locked)btn=`<button class="rbtn" disabled>🔒</button>`;
      else if(onCd)btn=`<button class="rbtn cd" disabled>${Math.ceil((cl.cd-now)/1000)}s</button>`;
      else if(cl.cleared)btn=`<button class="rbtn cleared" data-raid="${st.id}">RAID</button>`;
      else btn=`<button class="rbtn" data-raid="${st.id}">RAID</button>`;
    const html=`<div class="raid ${locked?'locked':''}"><div class="re">${st.e}</div>
      <div class="rmid"><div class="rn">${st.name}</div><div class="rsub">Enemy power ${ab(st.power)} ${cl.cleared?'· ✅ cleared':''}</div><div class="rrew">${rew}</div></div>${btn}</div>`;
    prevCleared = !!cl.cleared; return html; }).join('');
  $('scrBody').innerHTML=`<div class="squadbar"><div class="sp"><div class="k">YOUR RAID POWER</div><div class="v">⚔️ ${ab(eff)}</div></div>
    <div style="font-size:11px;color:var(--muted);text-align:right;max-width:150px">Power up heroes in <b style="color:var(--token)">Heroes</b> to clear tougher raids</div></div>
    <div class="scr-sub">Deploy your squad against bear-market events. Clear to loot $NIVAR & resources. Win = stage repeats on a short cooldown.</div>${rows}`;
  $('scrBody').querySelectorAll('[data-raid]').forEach(el=>el.addEventListener('click',()=>raid(STAGES.find(s=>s.id===el.dataset.raid))));
}
function raid(st){ const now=Date.now(); const cl=S.clears[st.id]||{}; if(cl.cd&&now<cl.cd){toast('On cooldown','gold');return;}
  const eff=Math.round(squadPower()*bonuses().raid); const win=eff>=st.power;
  if(win){ const first=!cl.cleared; grantRaid(st,first); S.clears[st.id]={cleared:true,cd:now+20000}; raidWonFlag=true; stats.raidWins++; dStats.raidWins++; showCombat(st,true,eff,first); }
  else showCombat(st,false,eff,false);
  refresh(); renderRaids(); }
function grantRaid(st,first){ const mult=first?1.5:1; for(const k in st.rew) S[k]+=Math.round(st.rew[k]*mult); }
function showCombat(st,win,eff,first){
  const rew=win?Object.keys(st.rew).map(k=>`<div class="ri2">${RICON[k]} ${ab(Math.round(st.rew[k]*(first?1.5:1)))}</div>`).join(''):'';
  $('modalBody').innerHTML=`<div class="mcard" style="border-color:${win?'rgba(124,255,176,.4)':'rgba(255,107,107,.4)'}">
    <div class="mtitle" style="color:${win?'var(--good)':'var(--bad)'}">${win?'VICTORY':'DEFEAT'}</div>
    <div class="vsrow"><div class="side"><div class="sl">YOU</div><div class="sv">${ab(eff)}</div></div><div class="vs">VS</div><div class="side"><div class="sl">${st.name}</div><div class="sv" style="color:var(--bad)">${ab(st.power)}</div></div></div>
    ${win?`<div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px">${first?'First clear bonus (×1.5)!':'Loot secured'}</div><div class="rewbox">${rew}</div>`
        :`<div style="text-align:center;font-size:13px;color:#cfe6ff;line-height:1.4">Squad too weak. Summon & level up heroes, then try again.</div>`}
    <button class="bigbtn ${win?'':'alt'}" id="cbOk" style="margin-top:12px">${win?'COLLECT':'BACK'}</button></div>`;
  $('cbOk').addEventListener('click',closeModal); openModal();
}

function renderResearch(){
  const rows=TECHS.map(t=>{ const lv=S.research[t.id]||0; const max=lv>=t.max; const c=scaleCost(t.cost,lv);
    const cur=`+${Math.round(t.v*lv*100)}%`, nxt=`+${Math.round(t.v*(lv+1)*100)}%`;
    const cost=Object.keys(c).map(k=>`<span style="${S[k]<c[k]?'color:var(--bad)':''}">${RICON[k]}${ab(c[k])}</span>`).join(' ');
    let btn = max?`<button class="tbtn max" disabled>MAX</button>`:`<button class="tbtn" data-tech="${t.id}" ${!canPay(c)?'disabled':''}>LV ${lv+1}</button>`;
    return `<div class="tech"><div class="te">${t.e}</div><div class="tmid"><div class="tn">${t.name}</div>
      <div class="tef">${t.k==='build'?'-':'+'}${Math.round(t.v*100)}% ${techLabel(t.k)} · now ${cur}${max?'':' → '+nxt}</div>
      <div class="tco">${max?'Maxed out':cost}</div></div>${btn}</div>`; }).join('');
  $('scrBody').innerHTML=`<div class="scr-sub">Permanent upgrades that boost your whole operation. Stacks with hero buffs.</div>${rows}`;
  $('scrBody').querySelectorAll('[data-tech]').forEach(el=>el.addEventListener('click',()=>research(el.dataset.tech)));
}
function techLabel(k){ return {coal:'Energy',iron:'Compute',wood:'Bandwidth',food:'Ramen',token:'$NIVAR',build:'build time',raid:'raid power'}[k]||k; }
function scaleCost(base,lv){ const c={}; for(const k in base)c[k]=Math.round(base[k]*Math.pow(1.6,lv)); return c; }
function research(id){ const t=TECHS.find(x=>x.id===id); const lv=S.research[id]||0; if(lv>=t.max)return; const c=scaleCost(t.cost,lv);
  if(!canPay(c)){toast('Not enough resources','gold');return;} pay(c); S.research[id]=lv+1; toast(t.name+' → Lv '+(lv+1),'good'); refresh(); renderResearch(); }

function renderShop(){
  const now=Date.now(); const airdropReady=now>=airdropAt;
  $('scrBody').innerHTML=`<div class="scr-sub">Boost your run. (On-chain $NIVAR purchases connect to your wallet in the production build.)</div>
    <div class="shopcard"><div class="se">🎁</div><div class="smid"><div class="sn">Genesis Pack</div><div class="sd">One-time: 1,000 💎 + a guaranteed Epic hero. For early survivors.</div></div>
      <button class="sbtn" id="genBtn" ${genesisClaimed?'disabled':''}>${genesisClaimed?'CLAIMED':'CLAIM'}</button></div>
    <div class="shopcard" style="border-color:rgba(124,255,176,.35)"><div class="se">🪂</div><div class="smid"><div class="sn">Daily Airdrop</div><div class="sd">Free 250 💎 every few minutes. Just for showing up.</div></div>
      <button class="sbtn" id="airBtn" ${airdropReady?'':'disabled'} style="${airdropReady?'background:linear-gradient(180deg,#7CFFB0,#36c98a)':''}">${airdropReady?'CLAIM':'SOON'}</button></div>
    <div class="shopcard"><div class="se">💎</div><div class="smid"><div class="sn">$NIVAR · 6,000</div><div class="sd">Top up your treasury to summon & speed up builds.</div></div>
      <button class="sbtn" id="buyBtn">$4.99</button></div>
    <div class="shopcard"><div class="se">🐳</div><div class="smid"><div class="sn">Whale Bundle</div><div class="sd">25,000 💎 + 10× summon + 3-day x2 mining boost.</div></div>
      <button class="sbtn" id="buyBtn2">$19.99</button></div>`;
  const gen=$('genBtn'); if(gen)gen.addEventListener('click',()=>{ if(genesisClaimed)return; genesisClaimed=true; S.crystal+=1000;
    // guaranteed epic
    const epics=HEROES_POOL.filter(h=>h.rarity==='epic'&&!S.heroes[h.id]); const h=epics.length?rand(epics):rand(HEROES_POOL.filter(x=>x.rarity==='epic'));
    if(!S.heroes[h.id]){ S.heroes[h.id]={level:1,shards:0}; if(S.squad.length<5)S.squad.push(h.id);} else S.heroes[h.id].shards+=3;
    toast('Genesis Pack claimed · +1,000 💎 + '+h.name,'gold'); refresh(); renderShop(); });
  const air=$('airBtn'); if(air)air.addEventListener('click',()=>{ if(Date.now()<airdropAt)return; S.crystal+=250; dStats.airdrop=true; airdropAt=Date.now()+180000; toast('Airdrop claimed · +250 💎','good'); refresh(); renderShop(); });
  $('buyBtn').addEventListener('click',()=>toast('Connect wallet — coming in production','gold'));
  $('buyBtn2').addEventListener('click',()=>toast('Connect wallet — coming in production','gold'));
}

/* centered modal */
const modal=$('modal'); let modalOpen=false;
function openModal(){ modal.classList.add('on'); bd.classList.add('on'); modalOpen=true; }
function closeModal(){ modal.classList.remove('on'); modalOpen=false; if(!sheet.classList.contains('on'))bd.classList.remove('on'); if(coachOn)coachLayout(); }

/* ============================================================
   SIM
   ============================================================ */
let storm=248;
function tick(dt){
  storm-=dt; if(storm<=0)storm=200+Math.random()*120;
  const target=(S.coal>0)?38:0; S.warmth+=(target-S.warmth)*Math.min(1,dt*0.4);
  if(S.coal>0)S.coal=Math.max(0,S.coal-1.2*S.furnace*dt);
  const m=warmthMult(); const B=bonuses();
  for(const b of BUILDINGS){ if(b.res&&b.res!=='pop')S[b.res]+= b.base*b.lv*m*dt*B.prodAll*(B[b.res]||1); }
  S.crystal += 0.06*byId('explorers').lv*dt*B.token;
  S.popCap=shelterPopCap(); if(S.pop<S.popCap)S.pop=Math.min(S.popCap,S.pop+dt*0.4);
  if(job&&Date.now()>=job.endsAt)finishJob();
  power=calcPower(); updateTaskBar();
}
function refresh(){ power=calcPower(); renderHUD(); refreshOverlay(); updateTaskBar(); if(screen.classList.contains('on'))$('scrBal').textContent=Math.floor(S.crystal).toLocaleString('en-US'); }
let last=performance.now(),acc=0;
function frame(now){ const rdt=Math.min(.25,(now-last)/1000); last=now; acc+=rdt; while(acc>=0.1){ tick(0.1); acc-=0.1; }
  for(const r of ['food','wood','coal','iron','crystal'])disp[r]+=(S[r]-disp[r])*0.2; disp.power+=(power-disp.power)*0.12; disp.warmth+=(S.warmth-disp.warmth)*0.15;
  $('stormTime').textContent=fmtT(storm); renderHUD(); refreshOverlay(); updateTaskBar();
  ctx.clearRect(0,0,VW,VH); ctx.drawImage(scene,0,0,scene.width,scene.height,cam.x,cam.y,OW,OH); drawLive(now);
  requestAnimationFrame(frame); }
function fmtT(s){ s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60),ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }

/* ============================================================
   PAN + WIRING
   ============================================================ */
let drag=null; const game=$('game');
game.addEventListener('pointerdown',e=>{ if(e.target.closest('.hud,.bspot,.left-cards,.right-rail,.task-bar,.bottom-nav,#sheet,#screen,#modal,.hintdrag'))return;
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; game.setPointerCapture(e.pointerId); $('hint').style.opacity='0'; });
game.addEventListener('pointermove',e=>{ if(!drag)return; cam.x=clamp(drag.cx+(e.clientX-drag.x),panMin.x,panMax.x); cam.y=clamp(drag.cy+(e.clientY-drag.y),panMin.y,panMax.y); positionOverlays(); });
game.addEventListener('pointerup',()=>drag=null); game.addEventListener('pointercancel',()=>drag=null);

document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>openScreen(b.dataset.nav)));
document.querySelectorAll('.rr[data-ev]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.ev==='Genesis Pack'||b.dataset.ev==='Daily Airdrop')openScreen('shop'); else toast(b.dataset.ev+' — soon','gold'); }));
$('mailBtn').addEventListener('click',()=>toast('gm. No new mail, ser','good'));
$('taskBar').addEventListener('click',e=>{ if(e.target.closest('#mailBtn'))return; openScreen('quests'); });
window.addEventListener('resize',()=>{ fit(); initFlakes(); if(coachOn)coachLayout(); });

/* ---- coach / onboarding ---- */
function navEl(n){ return document.querySelector('.nav[data-nav="'+n+'"]'); }
const COACH=[
  { type:'modal', title:'Welcome to NIVAR ❄️',
    body:'It\'s crypto winter. Your facilities mine resources <b>automatically</b> — spend them to upgrade, summon heroes, and raid the bear market to stack $NIVAR. Survive until the bull returns.',
    cta:'LET\'S GO →' },
  { type:'spot', target:()=>$('taskBar'), title:'Your goal, always here',
    body:'This shows your next objective. Tap it anytime to open all <b>Quests</b> and claim 💎 rewards.', advance:'next' },
  { type:'spot', target:()=>spots['cookhouse'], title:'1 · Upgrade a facility',
    body:'Tap the Mess Hall (or any building) to open it.', advance:'buildingOpened' },
  { type:'spot', target:()=>$('up')||$('fup'), title:'Spend & level up',
    body:'Hit upgrade. Higher level = more production.', advance:'upgradeStarted' },
  { type:'spot', target:()=>navEl('heroes'), title:'2 · Summon heroes',
    body:'Now tap Heroes to recruit your first CT legend.', advance:'screen:heroes' },
  { type:'spot', target:()=>$('sum1'), title:'Pull a hero',
    body:'Summon ×1. Equip up to 5 — their buffs power your economy and raids.', advance:'pulled' },
  { type:'spot', target:()=>navEl('raids'), title:'3 · Raid the bear',
    body:'Tap Raids and deploy your squad against bear-market events for loot.', advance:'screen:raids' },
  { type:'modal', title:'You\'re ready 🐻',
    body:'The loop: <b>Upgrade → Summon → Raid → grow Net Worth.</b> Tap the goal bar for your full <b>Quests</b> list and claim rewards. Keep your Rig fueled so Sentiment doesn\'t crash. GLHF, ser.',
    cta:'START PLAYING' },
];
function coachStart(){ coachStep=0; coachRender(); }
function coachRender(){
  const s=COACH[coachStep]; if(!s)return coachEnd();
  coachOn=true; $('coach').classList.add('on');
  const dim=$('coachDim'),spot=$('spot'),finger=$('finger'),cap=$('cap'); cap.style.display='block';
  if(s.type==='modal'){
    dim.style.display='block'; spot.style.display='none'; finger.style.display='none'; cap.classList.add('center');
    cap.innerHTML='<div class="ct">'+s.title+'</div><div class="cb">'+s.body+'</div>'+
      '<div class="cnext"><span class="cskip" id="capSkip">Skip</span><button class="cbtn" id="capCta">'+(s.cta||'NEXT')+'</button></div>';
    cap.style.width=Math.min(310,window.innerWidth-32)+'px'; cap.style.left='50%'; cap.style.top='50%'; cap.style.bottom='auto'; cap.style.transform='translate(-50%,-50%)';
  } else {
    dim.style.display='none'; cap.classList.remove('center'); cap.style.transform='none';
    const hint = s.advance==='next' ? '<button class="cbtn" id="capCta">NEXT</button>' : '<span style="font-size:11px;color:var(--token);font-weight:700">👆 do it to continue</span>';
    cap.innerHTML='<div class="ct">'+s.title+'</div><div class="cb">'+s.body+'</div>'+
      '<div class="cnext"><span class="cskip" id="capSkip">Skip tutorial</span>'+hint+'</div>';
    coachLayout();
  }
  const cta=$('capCta'); if(cta)cta.addEventListener('click',coachNext);
  const sk=$('capSkip'); if(sk)sk.addEventListener('click',coachEnd);
}
function coachLayout(){
  if(!coachOn)return; const s=COACH[coachStep]; if(!s||s.type!=='spot')return;
  const spot=$('spot'),finger=$('finger'),cap=$('cap');
  if(modalOpen){ spot.style.display='none'; finger.style.display='none'; cap.style.display='none'; return; }
  cap.style.display='block';
  let el=null; try{ el=s.target&&s.target(); }catch(e){}
  if(!el||!el.getBoundingClientRect){ spot.style.display='none'; finger.style.display='none';
    cap.style.left='50%'; cap.style.transform='translateX(-50%)'; cap.style.top='auto'; cap.style.bottom='100px'; cap.style.width=Math.min(280,window.innerWidth-24)+'px'; return; }
  const r=el.getBoundingClientRect(), pad=7;
  spot.style.display='block'; spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px'; spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
  const capW=Math.min(260,window.innerWidth-24); cap.style.width=capW+'px'; cap.style.transform='none';
  cap.style.left=clamp(r.left+r.width/2-capW/2,12,window.innerWidth-capW-12)+'px';
  finger.style.display='block'; finger.style.left=(r.left+r.width/2-15)+'px';
  if(r.bottom+150 < window.innerHeight){ cap.style.top=(r.bottom+50)+'px'; cap.style.bottom='auto'; finger.style.top=(r.bottom+4)+'px'; finger.textContent='👆'; }
  else { cap.style.top='auto'; cap.style.bottom=(window.innerHeight-r.top+48)+'px'; finger.style.top=(r.top-38)+'px'; finger.textContent='👇'; }
}
function coachNext(){ coachStep++; if(coachStep>=COACH.length)return coachEnd(); coachRender(); }
function coachFire(tr){ if(!coachOn)return; const s=COACH[coachStep]; if(s&&s.advance===tr)coachNext(); }
function coachEnd(){ coachOn=false; $('coach').classList.remove('on'); ['coachDim','spot','finger','cap'].forEach(id=>$(id).style.display='none'); }
setInterval(()=>{ if(coachOn)coachLayout(); },250);
$('helpRail').addEventListener('click',coachStart);

/* tap-to-learn on resource chips */
const REXP={ 'r-coal':'Energy ⚡ fuels your Rig to stay online. Made by the Power Plant.',
  'r-iron':'Compute 🖥️ is your mining hashpower. Made by the GPU Foundry.',

document.querySelectorAll('.rchip').forEach(ch=>{ const b=ch.querySelector('b'); if(b)ch.addEventListener('click',()=>toast(REXP[b.id]||'')); });
const gemChip=$('gemVal').closest('.chip'); if(gemChip)gemChip.addEventListener('click',()=>toast('$NIVAR 💎 — premium currency. Summon heroes & speed up builds.','gold'));
const powChip=$('powVal').closest('.chip'); if(powChip)powChip.addEventListener('click',()=>toast('Net Worth 💰 — your overall power. Grows with upgrades, heroes & research.','gold'));
const tempChip=document.querySelector('.temp'); if(tempChip)tempChip.addEventListener('click',()=>{ const t=tempLabel(); toast('Sentiment '+t[0]+' ('+t[2]+') — keep your Rig fueled to avoid Extreme Fear.','gold'); });

/* boot */
S.heroes['degen']={level:1,shards:0}; S.heroes['miner']={level:1,shards:0}; S.squad=['degen','miner'];
buildOverlay(); fit(); initFlakes(); S.popCap=shelterPopCap(); power=calcPower(); refresh(); updateTaskBar(); requestAnimationFrame(frame);
setTimeout(()=>{ $('hint').style.opacity='0'; },6000);
setTimeout(coachStart,450);
setTimeout(()=>toast('gm Operator. Survive the winter, stack $NIVAR.','gold'),500);
setInterval(()=>{ if(curScreen==='raids'){ const now=Date.now(); if(Object.values(S.clears).some(c=>c.cd&&now<c.cd))renderRaids(); } },1000);
</script>
