<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1500px;height:560px;display:flex;align-items:center;justify-content:center;gap:48px;
  background:radial-gradient(120% 140% at 50% 0%,#0e2c46 0%,#06101c 60%);font-family:"Liberation Sans","Arial",sans-serif}
.glowwrap{filter:drop-shadow(0 18px 50px rgba(86,224,255,.25))}
.wm{font-weight:900;font-size:150px;letter-spacing:.01em;line-height:.86;transform:scaleX(.84);transform-origin:left;
  background:linear-gradient(180deg,#ffffff,#a9c8e6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 16px rgba(125,211,252,.3))}
.sub{font-size:25px;letter-spacing:.46em;color:#9fb6cc;font-weight:700;margin-top:14px;padding-left:4px}
</style></head><body>
  <div class="glowwrap"><svg width="300" height="300" viewBox="0 0 132 132">
    <defs>
      <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeffd0"/><stop offset="1" stop-color="#41c8ff"/></linearGradient>
      <radialGradient id="e" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".5" stop-color="#ff9b3d"/><stop offset="1" stop-color="#ff5a1a"/></radialGradient>
      <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16395a"/><stop offset="1" stop-color="#0a1d30"/></linearGradient>
      <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect x="6" y="6" width="120" height="120" rx="28" fill="url(#p)" stroke="rgba(125,211,252,.4)" stroke-width="1.5"/>
    <g transform="translate(66,66)" stroke="url(#f)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#g)">
      <g id="a"><line x1="0" y1="0" x2="0" y2="-50"/><line x1="0" y1="-34" x2="-13" y2="-46"/><line x1="0" y1="-34" x2="13" y2="-46"/><line x1="0" y1="-20" x2="-10" y2="-29"/><line x1="0" y1="-20" x2="10" y2="-29"/></g>
      <use href="#a" transform="rotate(60)"/><use href="#a" transform="rotate(120)"/><use href="#a" transform="rotate(180)"/><use href="#a" transform="rotate(240)"/><use href="#a" transform="rotate(300)"/>
    </g>
    <circle cx="66" cy="66" r="9" fill="url(#e)"/>
  </svg></div>
  <div><div class="wm">NIVAR</div><div class="sub">SURVIVE&nbsp;THE&nbsp;WINTER</div></div>
</body></html>
