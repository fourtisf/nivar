<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0}
body{width:400px;height:400px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 32%,#11324e 0%,#0a1d30 46%,#06101c 100%)}
svg{display:block}
</style></head><body>
<svg width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#b6ffd6"/><stop offset=".55" stop-color="#56e0ff"/><stop offset="1" stop-color="#37b6ff"/></linearGradient>
    <radialGradient id="e" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".5" stop-color="#ff9b3d"/><stop offset="1" stop-color="#ff5a1a"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="44%" r="60%"><stop offset="0" stop-color="#56e0ff" stop-opacity=".16"/><stop offset="1" stop-color="#56e0ff" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="400" fill="url(#vig)"/>
  <!-- snow specks -->
  <g fill="#cfe6ff">
    <circle cx="62" cy="74" r="2" opacity=".6"/><circle cx="122" cy="42" r="1.4" opacity=".5"/><circle cx="330" cy="66" r="2.2" opacity=".6"/><circle cx="300" cy="120" r="1.4" opacity=".45"/>
    <circle cx="48" cy="196" r="1.6" opacity=".5"/><circle cx="360" cy="222" r="1.8" opacity=".55"/><circle cx="72" cy="324" r="2" opacity=".55"/><circle cx="152" cy="360" r="1.5" opacity=".5"/>
    <circle cx="272" cy="350" r="1.7" opacity=".5"/><circle cx="350" cy="320" r="1.4" opacity=".45"/><circle cx="200" cy="34" r="1.5" opacity=".5"/><circle cx="40" cy="124" r="1.3" opacity=".45"/>
  </g>
  <!-- premium frost rings (inside the circular crop) -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="rgba(125,211,252,.22)" stroke-width="2"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="rgba(124,255,176,.10)" stroke-width="6"/>
  <!-- Frostflake -->
  <g transform="translate(200,200) scale(2.92)" stroke="url(#f)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#g)">
    <g id="a"><line x1="0" y1="0" x2="0" y2="-50"/><line x1="0" y1="-34" x2="-13" y2="-46"/><line x1="0" y1="-34" x2="13" y2="-46"/><line x1="0" y1="-20" x2="-10" y2="-29"/><line x1="0" y1="-20" x2="10" y2="-29"/></g>
    <use href="#a" transform="rotate(60)"/><use href="#a" transform="rotate(120)"/><use href="#a" transform="rotate(180)"/><use href="#a" transform="rotate(240)"/><use href="#a" transform="rotate(300)"/>
  </g>
  <circle cx="200" cy="200" r="22" fill="url(#e)" filter="url(#g)"/>
</svg>
</body></html>
