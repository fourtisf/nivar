<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1500px;height:500px;overflow:hidden;position:relative;font-family:"Liberation Sans","Arial",sans-serif;
  background:radial-gradient(130% 170% at 24% 12%,#143a5c 0%,#0a1d30 48%,#06101c 100%)}
.snow{position:absolute;inset:0}
.snow i{position:absolute;background:#cfe6ff;border-radius:50%;opacity:.5}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:60px;padding:0 90px}
.icon{filter:drop-shadow(0 18px 50px rgba(86,224,255,.3));flex:none}
.txt{display:flex;flex-direction:column}
.wm{font-weight:900;font-size:128px;line-height:.84;letter-spacing:.01em;transform:scaleX(.84);transform-origin:left;
  background:linear-gradient(180deg,#ffffff,#a9c8e6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 16px rgba(125,211,252,.3))}
.sub{font-size:22px;letter-spacing:.42em;color:#bcd2e8;font-weight:700;margin-top:16px;padding-left:3px}
.chips{display:flex;gap:14px;margin-top:26px}
.chip{font-size:17px;font-weight:700;letter-spacing:.12em;padding:9px 18px;border-radius:30px;
  background:rgba(12,30,48,.7);border:1px solid rgba(125,211,252,.3);color:#cfe6ff}
.chip.tk{border-color:rgba(124,255,176,.5);color:#7CFFB0}
.url{position:absolute;top:34px;right:54px;font-size:20px;font-weight:700;letter-spacing:.14em;color:#7CFFB0}
</style></head><body>
  <div class="snow" id="snow"></div>
  <div class="url">nivar.fun</div>
  <div class="wrap">
    <div class="icon"><svg width="248" height="248" viewBox="0 0 132 132">
      <defs>
        <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeffd0"/><stop offset="1" stop-color="#41c8ff"/></linearGradient>
        <radialGradient id="e" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".5" stop-color="#ff9b3d"/><stop offset="1" stop-color="#ff5a1a"/></radialGradient>
        <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16395a"/><stop offset="1" stop-color="#0a1d30"/></linearGradient>
        <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect x="6" y="6" width="120" height="120" rx="30" fill="url(#p)" stroke="rgba(125,211,252,.4)" stroke-width="1.5"/>
      <g transform="translate(66,66)" stroke="url(#f)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#g)">
        <g id="a"><line x1="0" y1="0" x2="0" y2="-50"/><line x1="0" y1="-34" x2="-13" y2="-46"/><line x1="0" y1="-34" x2="13" y2="-46"/><line x1="0" y1="-20" x2="-10" y2="-29"/><line x1="0" y1="-20" x2="10" y2="-29"/></g>
        <use href="#a" transform="rotate(60)"/><use href="#a" transform="rotate(120)"/><use href="#a" transform="rotate(180)"/><use href="#a" transform="rotate(240)"/><use href="#a" transform="rotate(300)"/>
      </g>
      <circle cx="66" cy="66" r="9" fill="url(#e)"/>
    </svg></div>
    <div class="txt">
      <div class="wm">NIVAR</div>
      <div class="sub">SURVIVE&nbsp;THE&nbsp;WINTER</div>
      <div class="chips">
        <span class="chip tk">$NIVAR</span>
        <span class="chip">SOLANA · GAMEFI</span>
        <span class="chip">BASE-BUILDER · IDLE</span>
      </div>
    </div>
  </div>
  <script>
    const s=document.getElementById('snow');let h='';
    const seed=[12,440,7,900,3,140,30,1200,9,260,2,80,55,520,40,1330,16,360,1,70,28,980,18,610,4,180,33,1420,11,300,6,840,22,470,14,1100,2,30,38,720];
    for(let i=0;i<46;i++){const x=(seed[(i*7)%seed.length]*13+i*131)%1500;const y=(seed[(i*5+3)%seed.length]*7+i*97)%500;const r=(i%4)*0.6+1;
      h+=`<i style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;opacity:${.25+(i%5)*.1}"></i>`;}
    s.innerHTML=h;
  </script>
</body></html>
