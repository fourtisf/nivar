<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;overflow:hidden;position:relative;font-family:"Liberation Sans","Arial",sans-serif;
  background:radial-gradient(130% 150% at 18% 10%,#15406a 0%,#0a1d30 46%,#06101c 100%)}
.snow{position:absolute;inset:0}.snow i{position:absolute;background:#cfe6ff;border-radius:50%}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:40px;padding:74px 84px}
.left{flex:1;display:flex;flex-direction:column;justify-content:center}
.logo{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.h1{font-weight:900;font-size:82px;line-height:.96;letter-spacing:.005em;transform:scaleX(.9);transform-origin:left;
  background:linear-gradient(180deg,#ffffff,#bcd6f0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(125,211,252,.28))}
.h1 .tk{background:linear-gradient(180deg,#b6ffd6,#41c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:25px;color:#aec6e0;line-height:1.45;margin-top:22px;max-width:640px;font-weight:600}
.sub b{color:#eaf4ff}
.chips{display:flex;gap:13px;margin-top:30px;flex-wrap:wrap}
.chip{font-size:17px;font-weight:700;letter-spacing:.12em;padding:10px 20px;border-radius:30px;
  background:rgba(12,30,48,.7);border:1px solid rgba(125,211,252,.3);color:#cfe6ff}
.chip.tk{border-color:rgba(124,255,176,.55);color:#7CFFB0}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:40px;width:fit-content;
  font-size:27px;font-weight:900;letter-spacing:.02em;padding:18px 34px;border-radius:18px;color:#04231a;
  background:linear-gradient(180deg,#9bffc6,#36c98a);box-shadow:0 14px 36px rgba(54,201,138,.4)}
.right{flex:none;position:relative;display:flex;align-items:center;justify-content:center}
.glowbg{position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(86,224,255,.32),transparent 62%);filter:blur(8px)}
.device{position:relative;border-radius:34px;padding:10px;background:linear-gradient(180deg,#1a3e5e,#0a1d30);
  border:1px solid rgba(125,211,252,.35);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.device img{display:block;height:752px;width:auto;border-radius:26px}
.url{position:absolute;bottom:40px;left:88px;font-size:22px;font-weight:800;letter-spacing:.14em;color:#7CFFB0}
</style></head><body>
  <div class="snow" id="snow"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">
        <svg width="92" height="92" viewBox="0 0 132 132">
          <defs>
            <linearGradient id="f" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#b6ffd6"/><stop offset=".55" stop-color="#56e0ff"/><stop offset="1" stop-color="#37b6ff"/></linearGradient>
            <radialGradient id="e" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".5" stop-color="#ff9b3d"/><stop offset="1" stop-color="#ff5a1a"/></radialGradient>
            <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173d60"/><stop offset="1" stop-color="#0a1d30"/></linearGradient>
            <linearGradient id="wm" x1="0" y1="13" x2="0" y2="140" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dbe9f8"/><stop offset="1" stop-color="#9cc0e4"/></linearGradient>
            <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect x="6" y="6" width="120" height="120" rx="28" fill="url(#p)" stroke="rgba(125,211,252,.4)" stroke-width="1.5"/>
          <g transform="translate(66,66)" stroke="url(#f)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#g)">
            <g id="a"><line x1="0" y1="0" x2="0" y2="-50"/><line x1="0" y1="-34" x2="-13" y2="-46"/><line x1="0" y1="-34" x2="13" y2="-46"/><line x1="0" y1="-20" x2="-10" y2="-29"/><line x1="0" y1="-20" x2="10" y2="-29"/></g>
            <use href="#a" transform="rotate(60)"/><use href="#a" transform="rotate(120)"/><use href="#a" transform="rotate(180)"/><use href="#a" transform="rotate(240)"/><use href="#a" transform="rotate(300)"/>
          </g>
          <circle cx="66" cy="66" r="9" fill="url(#e)"/>
        </svg>
        <svg width="300" height="86" viewBox="0 0 470 165">
          <g transform="translate(8,12)" fill="none" stroke="url(#wm)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <g transform="translate(0,0)"><path d="M13,140 L13,13 L83,140 L83,13"/></g>
            <g transform="translate(112,0)"><path d="M13,13 L13,140"/></g>
            <g transform="translate(158,0)"><path d="M13,13 L48,140 L83,13"/></g>
            <g transform="translate(270,0)"><path d="M11,140 L48,13 L85,140 M24,96 L72,96"/></g>
            <g transform="translate(382,0)"><path d="M13,140 L13,13 L52,13 C82,13 82,74 52,74 L13,74 M48,74 L84,140"/></g>
          </g>
        </svg>
      </div>
      <div class="h1">BUILD · SUMMON · RAID<br><span class="tk">STACK $NIVAR</span></div>
      <div class="sub">Crypto-winter survival <b>GameFi on Solana</b>. An idle base-builder with a 10-hero CT gacha, bear-market raids &amp; on-chain $NIVAR. <b>Play free.</b></div>
      <div class="chips"><span class="chip tk">$NIVAR</span><span class="chip">SOLANA · GAMEFI</span><span class="chip">IDLE + GACHA + RAIDS</span></div>
      <div class="cta">▶&nbsp;&nbsp;PLAY FREE — nivar.fun</div>
    </div>
    <div class="right">
      <div class="glowbg"></div>
      <div class="device"><img src="game-frame.png"></div>
    </div>
  </div>
  <script>
    const s=document.getElementById('snow');let h='';
    const seed=[12,440,7,900,3,140,30,1200,9,260,2,80,55,520,40,1330,16,360,1,70,28,980,18,610,4,180,33,1420,11,300];
    for(let i=0;i<54;i++){const x=(seed[(i*7)%seed.length]*17+i*151)%1600;const y=(seed[(i*5+3)%seed.length]*9+i*107)%900;const r=(i%4)*0.6+1;
      h+=`<i style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;opacity:${.2+(i%5)*.1}"></i>`;}
    s.innerHTML=h;
  </script>
</body></html>
