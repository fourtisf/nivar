<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0}
body{width:400px;height:400px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 30%,#11324e 0%,#0a1d30 45%,#06101c 100%)}
svg{display:block}
</style></head><body>
<svg width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#b6ffd6"/><stop offset=".55" stop-color="#56e0ff"/><stop offset="1" stop-color="#37b6ff"/></linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#56e0ff" stop-opacity=".14"/><stop offset="1" stop-color="#56e0ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#vig)"/>
  <!-- snow specks -->
  <g fill="#cfe6ff" opacity=".55">
    <circle cx="60" cy="70" r="2"/><circle cx="120" cy="40" r="1.4"/><circle cx="330" cy="64" r="2.2"/><circle cx="300" cy="120" r="1.4"/>
    <circle cx="48" cy="190" r="1.6"/><circle cx="360" cy="220" r="1.8"/><circle cx="70" cy="320" r="2"/><circle cx="150" cy="360" r="1.5"/>
    <circle cx="270" cy="350" r="1.7"/><circle cx="350" cy="320" r="1.4"/><circle cx="200" cy="36" r="1.5"/><circle cx="40" cy="120" r="1.3"/>
  </g>
  <!-- inner frost ring (premium coin edge, inside the circular crop) -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="rgba(125,211,252,.22)" stroke-width="2"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="rgba(124,255,176,.10)" stroke-width="6"/>
  <!-- Crystal N monogram -->
  <g transform="translate(200,206)" filter="url(#g)">
    <polyline points="-72,78 -72,-78 72,78 72,-78" fill="none" stroke="url(#f)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- highlight pass -->
    <polyline points="-72,78 -72,-78 72,78 72,-78" fill="none" stroke="#eaffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- snow caps -->
    <polygon points="-72,-78 -90,-96 -54,-96" fill="#eaf4ff"/>
    <polygon points="72,-78 90,-96 54,-96" fill="#eaf4ff"/>
  </g>
</svg>
</body></html>
